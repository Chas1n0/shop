<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Shop the clothing collection from Chase McDougall."><meta name="theme-color" content="#f5f3ed"><title>The Shop — Chase McDougall</title><link rel="stylesheet" href="/shop/styles.css"><script type="module" src="/shop/storefront.js"></script><link rel="icon" href="/favicon.ico?v=1" sizes="any"><link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"></head>
<body>
<header class="topbar"><a class="wordmark" href="/">chase mcdougall.</a><nav class="toplinks" aria-label="Main navigation"><a href="/" class="desktop">Back to links ↗</a><button class="bag-button" id="open-bag">Bag <span id="bag-count" class="count">0</span></button></nav></header>
<main><section class="hero"><div><span class="eyebrow">The personal collection / 001</span><h1 id="shop-title">The Shop.</h1><p id="shop-tagline">A collection by Chase McDougall.</p></div><div class="hero-note">A little style. A little personality.<br>Find something that feels like you.</div></section>
<section class="catalog" aria-label="Product catalog"><div id="checkout-notice" class="notice" hidden></div><div class="catalog-toolbar"><nav class="filters" id="filters" aria-label="Product categories"></nav><span id="product-count" class="small muted"></span></div><div id="products" class="products"><p class="loading" role="status">Loading the collection…</p></div></section></main>
<footer class="site-footer"><span>© <span id="year"></span> Chase McDougall</span><div class="footerlinks"><button class="text-button" data-policy="shippingPolicy">Shipping</button><button class="text-button" data-policy="returnPolicy">Returns</button><button class="text-button" data-policy="privacy">Privacy</button><a id="contact-link" hidden>Contact</a><a href="/shop/admin/">Manager login ↗</a></div></footer>
<dialog id="product-dialog" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button class="close" data-close aria-label="Close product">×</button></div><div id="product-detail"></div></dialog>
<dialog id="bag-dialog" aria-labelledby="bag-title"><div class="dialog-head"><h2 id="bag-title">Your bag</h2><button class="close" data-close aria-label="Close bag">×</button></div><div id="bag-content"></div></dialog>
<dialog id="policy-dialog" aria-labelledby="policy-title"><div class="dialog-head"><h2 id="policy-title"></h2><button class="close" data-close aria-label="Close policy">×</button></div><div id="policy-body" class="policy-body"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
